# Spark logging configuration (minimalistic for demo)
# Set everything to WARN level to reduce log volume and improve performance

log4j.rootCategory=WARN, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Suppress verbose logging from specific packages
log4j.logger.org.apache.spark=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.parquet=WARN
log4j.logger.parquet=WARN
log4j.logger.org.apache.orc=WARN
log4j.logger.org.apache.hadoop.hive.metastore.RetryingHMSHandler=FATAL
log4j.logger.org.apache.hadoop.hive.ql.exec.FunctionRegistry=ERROR
log4j.logger.org.apache.spark.repl.SparkIMain$exprTyper=ERROR
log4j.logger.org.apache.spark.repl.SparkILoop$SparkILoopInterpreter=ERROR
log4j.logger.org.parquet.hadoop.ParquetOutputCommitter=ERROR
log4j.logger.org.apache.hadoop.hive.metastore=FATAL

# Async appender for better performance
log4j.appender.console=org.apache.log4j.AsyncAppender
log4j.appender.console.Target=System.err
