## Kafka Broker Configuration (Minimalistic for 12GB demo)

# Broker ID
broker.id=1

# Listeners
listeners=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://kafka:9092
advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# Zookeeper
zookeeper.connect=zookeeper:2181
zookeeper.session.timeout.ms=18000

# Log Retention (aggressive for 12GB)
log.retention.hours=24
log.retention.bytes=536870912
log.segment.bytes=104857600
log.cleanup.policy=delete
log.cleanup.interval.ms=300000

# Performance Tuning
num.io.threads=8
num.network.threads=5
num.replica.fetchers=4
replica.socket.receive.buffer.bytes=65536
replica.socket.send.buffer.bytes=65536

# Replication (single broker - no replication)
default.replication.factor=1
min.insync.replicas=1
offsets.replication.factor=1
transaction.state.log.replication.factor=1

# Compression
compression.type=gzip
lz4.memory.usage=64

# Topics (auto-create disabled in docker-compose)
auto.create.topics.enable=false
create.topic.policy.class.name=

# Consumer Groups
offsets.topic.num.partitions=1
offsets.topic.replication.factor=1
offsets.retention.minutes=10080

# Timing
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000

# Fetch sizes
fetch.min.bytes=1
fetch.max.wait.ms=500
replica.lag.time.max.ms=10000
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# SSL disabled (demo only)
ssl.enabled.protocols=TLSv1.2

# SASL disabled (demo only)
sasl.enabled.mechanisms=PLAIN
