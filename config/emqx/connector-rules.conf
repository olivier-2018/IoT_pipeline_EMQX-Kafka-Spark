##--------------------------------------------------------------------
## Rule Engine: Forward MQTT topics to Kafka via producer connector
## Assumes 'my_kafka_producer' connector already exists
##--------------------------------------------------------------------

rule_engine {
  rules {
    weather_to_kafka {
      sql = "SELECT * FROM \"devices/weather/+\""
      actions = [
        {
          name = "send_to_kafka"
          connector = "my_kafka_producer"
        }
      ]
      enable = true
      description = "Forward weather data to Kafka"
    }

    orders_to_kafka {
      sql = "SELECT * FROM \"devices/orders/+\""
      actions = [
        {
          name = "send_to_kafka"
          connector = "my_kafka_producer"
        }
      ]
      enable = true
      description = "Forward orders data to Kafka"
    }

    logistics_to_kafka {
      sql = "SELECT * FROM \"devices/logistics/+\""
      actions = [
        {
          name = "send_to_kafka"
          connector = "my_kafka_producer"
        }
      ]
      enable = true
      description = "Forward logistics data to Kafka"
    }

    inventory_to_kafka {
      sql = "SELECT * FROM \"devices/inventory/+\""
      actions = [
        {
          name = "send_to_kafka"
          connector = "my_kafka_producer"
        }
      ]
      enable = true
      description = "Forward inventory data to Kafka"
    }

    users_to_kafka {
      sql = "SELECT * FROM \"devices/users/+\""
      actions = [
        {
          name = "send_to_kafka"
          connector = "my_kafka_producer"
        }
      ]
      enable = true
      description = "Forward user events data to Kafka"
    }
  }
}
