## EMQX Configuration for IoT Data Pipeline
## Minimalistic settings for 12GB laptop demo

##--------------------------------------------------------------------
## Node Configuration
##--------------------------------------------------------------------

node {
  name = "emqx@emqx"
  cookie = "emqx_cookie"
  data_dir = "/opt/emqx/data"
  db_backend = mnesia
}

##--------------------------------------------------------------------
## Listener: MQTT (TCP)
##--------------------------------------------------------------------

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1000000
  mountpoint = ""
}

## Listener: Dashboard
# Listener: Dashboard
# listeners.http.dashboard {
#   bind = "0.0.0.0:18083"
# }

##--------------------------------------------------------------------
## Cluster Discovery (single node - no cluster)
##--------------------------------------------------------------------

cluster {
  name = emqx@127.0.0.1
  discovery_strategy = manual
  autoclean = 5m
  autoheal = true
}

##--------------------------------------------------------------------
## Authentication & Authorization (disabled for demo)
##--------------------------------------------------------------------

authentication = []
authorization {
  deny_action = ignore
  cache {
    enable = true
    max_size = 32
    ttl = 1h
  }
}

##--------------------------------------------------------------------
## Message Persistence (disabled for demo)
##--------------------------------------------------------------------

persistence {
  messages {
    backend = ram
  }
}

##--------------------------------------------------------------------
## Connectors (Kafka bridge via emqx_bridge_kafka plugin)
## Note: Bridge configuration done via rules.sql (rule engine)
##--------------------------------------------------------------------

gateway {}

##--------------------------------------------------------------------
## Performance Tuning for 2GB memory limit
##--------------------------------------------------------------------

## Disable unnecessary plugins
plugins {
#  extra_search_paths = [
#    "${EMQX_HOME}/plugins"
#  ]
}

## Minimal logging
log {
  console {
    level = warning
    formatter = text
  }
  file {
    enable = false
  }
}

## Memory tuning
sysmon {
  vm {
    long_gc = disabled
    long_schedule = disabled
    large_heap = disabled
  }
}
