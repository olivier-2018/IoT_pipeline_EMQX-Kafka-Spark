# EMQX MQTT → Kafka Topic Mappings
# Format: MQTT_TOPIC_PATTERN|KAFKA_TOPIC|DATA_TYPE_ID
#
# MQTT_TOPIC_PATTERN: MQTT subscription pattern (using + for single level wildcard)
# KAFKA_TOPIC: Target Kafka topic name
# DATA_TYPE_ID: Identifier for the data type (used for rule naming)
#
# All MQTT messages matching the pattern will be forwarded to the corresponding Kafka topic

devices/weather/+|iot-weather-data|weather
devices/orders/+|iot-orders-events|orders
devices/logistics/+|iot-logistics-dispatch|logistics
devices/inventory/+|iot-inventory-changes|inventory
devices/users/+|iot-users-activity|users
