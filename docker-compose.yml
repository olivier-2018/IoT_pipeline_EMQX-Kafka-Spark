# IoT Data Pipeline Demo - 12GB Laptop Edition
# Minimalist setup: EMQX -> Kafka -> Spark -> PostgreSQL
# Total resource allocation: ~10GB (leaves 2GB headroom)

services:
  # MQTT Broker with Kafka Bridge
  # Receives IoT data from Python generators, forwards to Kafka topics
  emqx:
    image: emqx/emqx:6.2.1
    container_name: emqx
    ports:
      - "1883:1883"    # MQTT
      - "18083:18083"  # Web UI (admin:public)
    environment:
      - EMQX_NAME=emqx
    volumes:
      - ./config/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      # - ./config/emqx/connector-rules.conf:/opt/emqx/etc/connector-rules.conf:ro
      - emqx-data:/opt/emqx/data
    networks:
      - iot-network
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker (Single broker for demo)
  # Receives MQTT data from EMQX bridge, stores in topics
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_MS: 86400000  # 1 day
      KAFKA_LOG_RETENTION_BYTES: 536870912  # 512 MB per topic
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_COMPRESSION_TYPE: gzip
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
    depends_on:
      - zookeeper
    networks:
      - iot-network
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_HEAP_OPTS: "-Xmx512m"
    networks:
      - iot-network
    mem_limit: 1g
    memswap_limit: 1g
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Master
  # Orchestrates Spark jobs submitted by Spark workers
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: 'true'
    volumes:
      - ./spark-jobs:/spark-jobs:ro
      - spark-master-data:/tmp/spark-data
    networks:
      - iot-network
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    ports:
      - "8081:8081"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 1
      SPARK_NO_DAEMONIZE: 'true'
      SPARK_LOCAL_IP: spark-worker-1
    volumes:
      - ./spark-jobs:/spark-jobs:ro
      - spark-worker-1-data:/tmp/spark-data
    depends_on:
      - spark-master
    networks:
      - iot-network
    mem_limit: 1500m
    memswap_limit: 1500m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Worker 2
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    ports:
      - "8082:8081"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 1
      SPARK_NO_DAEMONIZE: 'true'
      SPARK_LOCAL_IP: spark-worker-2
    volumes:
      - ./spark-jobs:/spark-jobs:ro
      - spark-worker-2-data:/tmp/spark-data
    depends_on:
      - spark-master
    networks:
      - iot-network
    mem_limit: 1500m
    memswap_limit: 1500m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  # Final destination for transformed IoT data
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_demo_pass}
      POSTGRES_DB: iot_database
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iot-network
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'
    command:
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI - Web interface for monitoring Kafka topics, messages, and partitions
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8888:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - iot-network
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Paris
    networks:
      - iot-network
    volumes:
      - node_red_data:/data
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'

networks:
  iot-network:
    driver: bridge
    external: false

volumes:
  emqx-data:
  spark-master-data:
  spark-worker-1-data:
  spark-worker-2-data:
  node_red_data:
  