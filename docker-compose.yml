# IoT Data Pipeline Demo - 12GB Laptop Edition
# Minimalist setup: EMQX -> Kafka -> Spark -> PostgreSQL
# Total resource allocation: ~10GB (leaves 2GB headroom)

services:
  # MQTT Broker with Kafka Bridge
  # Receives IoT data from Python generators, forwards to Kafka topics
  emqx:
    image: emqx/emqx:6.2.1
    container_name: emqx
    ports:
      - "1883:1883"    # MQTT
      - "18083:18083"  # Web UI (admin:public)
      - "8083:8083"    # WebSocket (debug)
    environment:
      - EMQX_NAME=emqx
    volumes:
      # See config/emqx/README.md for EMQX config info
      - ./config/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./data-emqx:/opt/emqx/data
    networks:
      - iot-network
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker (Single broker for demo)
  # Receives MQTT data from EMQX bridge, stores in topics
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_MS: 86400000  # 1 day
      KAFKA_LOG_RETENTION_BYTES: 536870912  # 512 MB per topic
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_COMPRESSION_TYPE: gzip
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
    volumes:
      - ./data-kafka:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - iot-network
    mem_limit: 2g
    memswap_limit: 2g
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_HEAP_OPTS: "-Xmx512m"
    volumes:
      - ./data-zookeeper:/var/lib/zookeeper/data
      # dataLogDir (transaction log) must be persisted too, or it lands on an
      # anonymous volume that gets discarded on every container recreation -
      # losing the /cluster/id znode and desyncing Kafka's cluster ID.
      - ./data-zookeeper-log:/var/lib/zookeeper/log
    networks:
      - iot-network
    mem_limit: 1g
    memswap_limit: 1g
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8888:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    volumes:
      - ./data-kafka-ui:/workspace
    depends_on:
      - kafka
      - zookeeper
    networks:
      - iot-network
    mem_limit: 512m
    memswap_limit: 512m
    # Trimmed from 0.5 to make room for the Spark worker cpus bump below - a
    # dev-facing dashboard, not load-bearing for the pipeline, so it's the
    # safer trim target vs. Zookeeper (which affects Kafka broker stability).
    cpus: '0.25'

  # Spark Master
  # Orchestrates Spark jobs submitted by Spark workers
  spark-master:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-master
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040-4044:4040-4044"   # Application UI (Jobs/Stages/Storage/Environment/Executors) - one port per concurrent driver in this container (submit-spark-jobs.sh runs up to 5)
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    volumes:
      - ./spark-structured-streaming-jobs:/opt/spark-structured-streaming-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-master:/tmp/spark-data
    networks:
      - iot-network
    # Notes: Mem size for 5 concurrent ingestion jobs: ~3.3GB for the drivers + ~300-700MB headroom for the Master.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Worker 1
  spark-worker-1:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-worker-1
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    ports:
      - "8081:8081"   # Worker UI
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
      # Without this, the Worker's default core count comes from the JVM's
      # cgroup-aware Runtime.availableProcessors(), which reads the `cpus:`
      # quota below (2.0 -> 2 cores) - too few to run 5 concurrent streaming
      # jobs. These are I/O-bound (waiting on Kafka/Postgres), so more
      # scheduling slots than the CPU quota is fine.
      - SPARK_WORKER_CORES=3
      # Default worker memory reports as just 1024m, and Spark's default 1g
      # executor-memory would let a single executor consume the whole thing -
      # blocking every other concurrent job regardless of free cores. Sized
      # for ~3 executors@768m (Spark enforces a ~450MB executor-memory floor)
      # with margin below the container mem_limit for worker daemon overhead.
      - SPARK_WORKER_MEMORY=2500m
    volumes:
      - ./spark-structured-streaming-jobs:/opt/spark-structured-streaming-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-worker-1:/tmp/spark-data
    depends_on:
      - spark-master
    networks:
      - iot-network
    mem_limit: 3000m
    memswap_limit: 3000m
    cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Worker 2
  spark-worker-2:
    build:
      context: .
      dockerfile: config/spark/Dockerfile
    container_name: spark-worker-2
    command: >
      bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    ports:
      - "8082:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=2500m
    volumes:
      - ./spark-structured-streaming-jobs:/opt/spark-structured-streaming-jobs:ro
      - ./data-spark-logs:/opt/spark/logs
      - ./data-spark-worker-2:/tmp/spark-data
    depends_on:
      - spark-master
    networks:
      - iot-network
    mem_limit: 3000m
    memswap_limit: 3000m
    cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  # Final destination for transformed IoT data
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_demo_pass}
      POSTGRES_DB: iot_database
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data-postgres:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iot-network
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'
    command:
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI - Web interface for monitoring Kafka topics, messages, and partitions

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Paris
    networks:
      - iot-network
    volumes:
      - ./data-nodered:/data
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'

networks:
  iot-network:
    driver: bridge
    external: false

